<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rancharia — Monte seu prato</title>
<meta name="theme-color" content="#2a1509">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #2a1509; --card: #341d0f; --card-2: #402617;
  --cream: #f7ecd8; --muted: #cdb99c; --gold: #f2c46d; --gold-d: #d8a24a;
  --ink: #2a1509; --line: rgba(242, 196, 109, .24); --ok: #7bd389;
  --radius: 22px; --f-display: "Anton", Impact, sans-serif;
  --f-script: "Yellowtail", cursive; --f-body: "Outfit", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
body.lock { overflow: hidden; position: fixed; inset: 0; width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
.wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 20px; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 50px; padding: 0 24px; border-radius: 999px; font-weight: 700; font-size: 16px;
  background: var(--gold); color: var(--ink); text-decoration: none; transition: .2s;
}
.btn:active { transform: scale(.97); }
.btn--block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* Topo e Hero */
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 30; background: rgba(42, 21, 9, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.brand { font-family: var(--f-display); font-size: 26px; letter-spacing: .05em; }
.hero { padding: 90px 0 30px; text-align: center; }
.hero h1 { font-family: var(--f-display); text-transform: uppercase; font-size: clamp(52px, 15vw, 130px); line-height: .95; }
.hero .script { display: block; font-family: var(--f-script); color: var(--gold); font-size: clamp(48px, 13vw, 100px); margin-top: -.2em; }
.hero p { margin: 16px auto 20px; max-width: 32ch; font-size: 18px; color: var(--muted); }

/* Pratos & Cards */
.plates { display: grid; gap: 12px; margin-bottom: 110px; }
@media (min-width: 760px) { .plates { grid-template-columns: 1fr 1fr; } }
.plate { position: relative; padding: 18px; border-radius: var(--radius); background: linear-gradient(160deg, var(--card-2), var(--card) 55%); border: 1px solid var(--line); }
.plate .price { position: absolute; top: 14px; right: 14px; padding: 2px 12px; border-radius: 999px; background: var(--gold); color: var(--ink); font-weight: 800; font-size: 17px; }
.plate .t1 { font-weight: 600; font-size: 12px; text-transform: uppercase; color: var(--muted); }
.plate .t2 { font-weight: 800; font-size: 22px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
.plate ul { margin: 6px 0 14px; font-size: 14px; display: grid; gap: 2px; }
.plate li { position: relative; padding-left: 14px; }
.plate li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

/* Barra Carrinho */
#cartBar {
  position: fixed; left: 50%; bottom: 16px; z-index: 40; width: calc(100% - 28px); max-width: 500px;
  transform: translate(-50%, 140%); transition: transform .3s ease; display: flex; align-items: center;
  justify-content: space-between; padding: 10px 14px 10px 20px; border-radius: 999px;
  background: var(--gold); color: var(--ink); font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
#cartBar.show { transform: translate(-50%, 0); }
#cartBar .go { padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--gold); }

/* Modais */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.sheet .back { position: absolute; inset: 0; background: rgba(0,0,0,.65); }
.sheet .panel {
  position: relative; width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 26px 26px 0 0; border: 1px solid var(--line); overflow: hidden;
}
.sheet.sheet--full .panel { max-height: 100dvh; height: 100dvh; border-radius: 0; }
.sheet .head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.sheet .head h2 { font-size: 20px; }
.sheet .head h2 small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.x { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); font-size: 20px; display: grid; place-items: center; }
.sheet .body { flex: 1; overflow-y: auto; padding: 18px 20px; }
.sheet .foot { padding: 14px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--card); }

/* Elementos do Montador */
.grp { margin-bottom: 20px; }
.grp-h { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
.opts { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
.opts.one { grid-template-columns: 1fr; }
.opt {
  display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 8px 12px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--card-2); text-align: left;
}
.opt .tick { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: grid; place-items: center; }
.opt.on { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 700; }
.opt.on .tick { border-color: var(--ink); background: var(--ink); }
.opt.on .tick::after { content: "✓"; color: var(--gold); font-size: 13px; line-height: 1; font-weight: 800; }

.builder-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 14px; background: var(--card-2); border: 1.5px solid var(--line); margin-bottom: 6px; }
.qty { display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--line); border-radius: 999px; }
.qty button { width: 34px; height: 34px; font-size: 18px; border-radius: 50%; }
.qty output { min-width: 22px; text-align: center; font-weight: 700; }
.foot-row { display: flex; align-items: center; gap: 10px; }

/* Checkout */
.line { padding: 12px 0; border-bottom: 1px solid var(--line); }
.line-top { display: flex; justify-content: space-between; font-weight: 700; }
.field { margin-bottom: 14px; }
input[type="text"], textarea { width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--card-2); border: 1.5px solid var(--line); color: var(--cream); font: inherit; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
.seg .opt { justify-content: center; text-align: center; min-height: 42px; padding: 4px; }
.seg .opt .tick { display: none; }
#toast { position: fixed; left: 50%; top: 76px; z-index: 90; transform: translate(-50%, -20px); opacity: 0; pointer-events: none; padding: 8px 18px; border-radius: 999px; background: var(--cream); color: var(--ink); font-weight: 700; transition: .25s; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="brand">RANCHARIA</span>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1><span>Rancharia</span><span class="script">Cardápio</span></h1>
    <p>Escolha seu prato, monte seus acompanhamentos e envie seu pedido pelo WhatsApp.</p>
  </div>

  <div class="plates" id="plates">
    <p style="text-align:center;grid-column:1/-1;color:var(--muted)">Carregando cardápio...</p>
  </div>
</main>

<button id="cartBar">
  <div>
    <small id="barCount">0 itens</small><br>
    <b id="barTotal">R$ 0,00</b>
  </div>
  <span class="go">Ver pedido</span>
</button>

<!-- Sheet Montador de Prato -->
<div class="sheet sheet--full" id="builder" hidden>
  <div class="back" onclick="closeSheet('builder')"></div>
  <div class="panel">
    <div class="head">
      <div><h2 id="bTitle"></h2></div>
      <button class="x" onclick="closeSheet('builder')">×</button>
    </div>
    <div class="body" id="bBody"></div>
    <div class="foot">
      <div class="foot-row">
        <div class="qty">
          <button onclick="changeDraftQty(-1)">−</button>
          <output id="bQty">1</output>
          <button onclick="changeDraftQty(1)">+</button>
        </div>
        <button class="btn btn--block" id="addBtn" onclick="addToCart()"></button>
      </div>
    </div>
  </div>
</div>

<!-- Sheet Checkout / Carrinho -->
<div class="sheet sheet--full" id="cart" hidden>
  <div class="back" onclick="closeSheet('cart')"></div>
  <div class="panel">
    <div class="head">
      <h2 id="cTitle">Seu Pedido</h2>
      <button class="x" onclick="closeSheet('cart')">×</button>
    </div>
    <div class="body" id="cBody"></div>
    <div class="foot" id="cFoot"></div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://svvvzwsajneesmuatcvc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ARLDqBsmhhhfOUp6I2zKiw_9G7pQ5_O';
const WHATSAPP_LOJA = '5574988188139';

const $ = s => document.querySelector(s);
const brl = n => Number(n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let CATS = [], PRODS = [], CART = [], draft = null;
let checkoutStep = 'list';
const form = { nome: '', modo: 'local', mesa: '', bairro: '', rua: '', numero: '', pag: 'pix', troco: '', obs: '' };

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function openSheet(id) { $('#' + id).hidden = false; document.body.classList.add('lock'); }
function closeSheet(id) { $('#' + id).hidden = true; document.body.classList.remove('lock'); updateBar(); }

// 1. CARREGAMENTO 100% DINÂMICO DO BANCO
async function carregarCardapio() {
  try {
    const [c, p] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/categorias?select=*&order=ordem.asc,id.asc`, { headers: { apikey: SUPABASE_KEY } }).then(r => r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/produtos?select=*&order=id.asc`, { headers: { apikey: SUPABASE_KEY } }).then(r => r.json())
    ]);

    // Aplica configurações técnicas salvas nos produtos
    p.filter(x => x.nome === '__config').forEach(cfg => {
      const cat = c.find(ct => ct.id === cfg.categoria_id);
      if (cat && cfg.descricao) {
        try { Object.assign(cat, JSON.parse(cfg.descricao)); } catch(e){}
      }
    });

    CATS = c;
    PRODS = p.filter(x => !x.pausado && !String(x.nome).startsWith('__'));
    renderPlates();
  } catch(e) {
    $('#plates').innerHTML = '<p style="text-align:center;grid-column:1/-1">Erro ao carregar cardápio.</p>';
  }
}

// 2. RENDERIZAÇÃO DOS PRATOS NA TELA INICIAL
function renderPlates() {
  const container = $('#plates');
  const pratos = CATS.filter(c => (c.exibicao === 'prato' || !c.exibicao) && c.tipo !== 'item' && c.tipo !== 'bump');

  if (!pratos.length) {
    container.innerHTML = '<p style="text-align:center;grid-column:1/-1">Nenhum prato disponível no momento.</p>';
    return;
  }

  container.innerHTML = pratos.map(cat => {
    const itens = PRODS.filter(p => p.categoria_id === cat.id && p.nome !== 'Valor do prato');
    const planItem = PRODS.find(p => p.categoria_id === cat.id && p.nome === 'Valor do prato');
    const preco = planItem ? planItem.preco : (itens[0]?.preco || 0);

    return `
      <article class="plate">
        <span class="price">${brl(preco)}</span>
        <div class="t1">${/duas|gourmet/i.test(cat.nome) ? 'Com duas proteínas' : 'Com uma proteína'}</div>
        <div class="t2">${esc(cat.nome)}</div>
        <ul>${itens.map(it => `<li>${esc(it.nome)}</li>`).join('')}</ul>
        <button class="btn btn--block" onclick="openBuilder(${cat.id})">Montar esse prato</button>
      </article>
    `;
  }).join('');
}

// 3. MONTADOR DO PRATO
function openBuilder(catId) {
  const cat = CATS.find(c => c.id === catId);
  const planItem = PRODS.find(p => p.categoria_id === cat.id && p.nome === 'Valor do prato');
  const proteinas = PRODS.filter(p => p.categoria_id === cat.id && p.nome !== 'Valor do prato');
  const precoBase = planItem ? planItem.preco : 0;
  const escolhe = /duas|gourmet/i.test(cat.nome) ? 2 : 1;

  // Subcategorias vinculadas que realmente têm itens
  const subcategorias = CATS.filter(s => {
    if (s.tipo !== 'item') return false;
    const temItens = PRODS.some(p => p.categoria_id === s.id);
    if (!temItens) return false;
    if (s.parents && s.parents.length) return s.parents.map(String).includes(String(cat.id));
    return true;
  });

  draft = {
    catId: cat.id,
    nome: cat.nome,
    precoBase,
    escolhe,
    proteinasSelecionadas: [],
    subSelections: {},
    obs: '',
    qty: 1,
    subcategorias
  };

  $('#bTitle').innerHTML = `${esc(cat.nome)}<small>${brl(precoBase)}</small>`;

  let html = '';
  if (proteinas.length) {
    html += `
      <div class="grp">
        <div class="grp-h"><span>Proteínas (escolha ${escolhe})</span><span id="cntP">0/${escolhe}</span></div>
        <div class="opts one">${proteinas.map(p => `
          <button type="button" class="opt" onclick="toggleProteina('${esc(p.nome)}')">
            <span class="tick"></span>${esc(p.nome)}
          </button>
        `).join('')}</div>
      </div>
    `;
  }

  subcategorias.forEach(sub => {
    const itens = PRODS.filter(p => p.categoria_id === sub.id);
    html += `
      <div class="grp">
        <div class="grp-h"><span>${esc(sub.nome)}</span></div>
        ${itens.map(it => `
          <div class="builder-row">
            <div><b>${esc(it.nome)}</b>${it.preco > 0 ? `<i>+ ${brl(it.preco)}</i>` : ''}</div>
            <div class="qty">
              <button onclick="changeSubQty(${sub.id}, '${esc(it.nome)}',${it.preco}, -1)">−</button>
              <output id="out_${sub.id}_${esc(it.nome)}">0</output>
              <button onclick="changeSubQty(${sub.id}, '${esc(it.nome)}',${it.preco}, 1)">+</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  });

  html += `
    <div class="grp">
      <textarea placeholder="Observações (ex: sem salada, molho à parte)" oninput="draft.obs = this.value"></textarea>
    </div>
  `;

  $('#bBody').innerHTML = html;
  syncBuilder();
  openSheet('builder');
}

function toggleProteina(nome) {
  const idx = draft.proteinasSelecionadas.indexOf(nome);
  if (idx > -1) draft.proteinasSelecionadas.splice(idx, 1);
  else if (draft.proteinasSelecionadas.length < draft.escolhe) draft.proteinasSelecionadas.push(nome);
  else if (draft.escolhe === 1) draft.proteinasSelecionadas = [nome];
  syncBuilder();
}

function changeSubQty(subId, nome, preco, delta) {
  draft.subSelections[subId] = draft.subSelections[subId] || {};
  const cur = draft.subSelections[subId][nome]?.qty || 0;
  const nova = Math.max(0, cur + delta);
  if (nova === 0) delete draft.subSelections[subId][nome];
  else draft.subSelections[subId][nome] = { qty: nova, preco };
  
  const el = $(`#out_${subId}_${nome}`);
  if (el) el.textContent = nova;
  syncBuilder();
}

function changeDraftQty(d) {
  draft.qty = Math.max(1, draft.qty + d);
  $('#bQty').textContent = draft.qty;   syncBuilder(); }  function syncBuilder() {   $$('#bBody .opt').forEach(btn => {
    const txt = btn.textContent.trim();
    btn.classList.toggle('on', draft.proteinasSelecionadas.includes(txt));
  });
  const cp = $('#cntP');
  if (cp) cp.textContent = `${draft.proteinasSelecionadas.length}/${draft.escolhe}`;

  let extra = 0;
  Object.values(draft.subSelections).forEach(sub => {
    Object.values(sub).forEach(it => { extra += it.preco * it.qty; });
  });

  const totalUnit = draft.precoBase + extra;
  const btn = $('#addBtn');
  const falta = draft.escolhe - draft.proteinasSelecionadas.length;
  btn.disabled = falta > 0;
  btn.textContent = falta > 0 ? `Escolha ${falta} proteína(s)` : `Adicionar • ${brl(totalUnit * draft.qty)}`;
}

function addToCart() {
  let extra = 0;
  const subsResumo = [];
  Object.entries(draft.subSelections).forEach(([subId, itens]) => {
    const subCat = CATS.find(c => c.id == subId);
    const lista = [];
    Object.entries(itens).forEach(([nome, info]) => {
      extra += info.preco * info.qty;
      lista.push(info.qty > 1 ? `${info.qty}x ${nome}` : nome);
    });
    if (lista.length) subsResumo.push({ nome: subCat.nome, itens: lista });
  });

  CART.push({
    id: Date.now(),
    nome: draft.nome,
    preco: draft.precoBase + extra,
    qty: draft.qty,
    proteinas: [...draft.proteinasSelecionadas],
    subs: subsResumo,
    obs: draft.obs
  });

  closeSheet('builder');
  openCart();
}

// 4. CARRINHO & CHECKOUT WHATSAPP
function updateBar() {
  const count = CART.reduce((s, i) => s + i.qty, 0);
  const total = CART.reduce((s, i) => s + (i.preco * i.qty), 0);
  $('#barCount').textContent = `${count} item(ns)`;
  $('#barTotal').textContent = brl(total);
  $('#cartBar').classList.toggle('show', count > 0 && $('#cart').hidden && $('#builder').hidden);
}

function openCart() {
  checkoutStep = 'list';
  renderCart();
  openSheet('cart');
}

function renderCart() {
  const body = $('#cBody'), foot = $('#cFoot');
  const total = CART.reduce((s, i) => s + (i.preco * i.qty), 0);

  if (checkoutStep === 'list') {
    $('#cTitle').textContent = 'Seu Pedido';
    if (!CART.length) {
      body.innerHTML = '<p style="text-align:center;padding:40px 0;color:var(--muted)">Seu carrinho está vazio.</p>';
      foot.innerHTML = '<button class="btn btn--block" onclick="closeSheet(\'cart\')">Voltar ao cardápio</button>';
      return;
    }
    body.innerHTML = CART.map((it, idx) => `
      <div class="line">
        <div class="line-top"><span>${it.qty}x ${esc(it.nome)}</span><span>${brl(it.preco * it.qty)}</span></div>
        <small style="color:var(--muted)">${it.proteinas.join(' + ')}</small>
        ${it.subs.map(s => `<br><small style="color:var(--muted)">• ${esc(s.nome)}:${esc(s.itens.join(', '))}</small>`).join('')}
        ${it.obs ? `<br><small style="color:var(--muted)">• Obs: ${esc(it.obs)}</small>` : ''}
        <div style="display:flex;justify-content:space-between;margin-top:8px">
          <button style="color:var(--gold);font-size:13px" onclick="CART.splice(${idx},1);renderCart()">Remover</button>
        </div>
      </div>
    `).join('');

    foot.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin-bottom:12px">
        <span>Total:</span><span>${brl(total)}</span>
      </div>
      <button class="btn btn--block" onclick="checkoutStep='form';renderCart()">Continuar</button>
    `;
  } else {
    $('#cTitle').textContent = 'Finalizar Pedido';
    body.innerHTML = `
      <div class="field"><input type="text" placeholder="Seu nome" value="${esc(form.nome)}" oninput="form.nome=this.value"></div>
      <div class="field">
        <div class="seg">
          <button class="opt ${form.modo==='local'?'on':''}" onclick="form.modo='local';renderCart()">Comer aqui</button>
          <button class="opt ${form.modo==='retirar'?'on':''}" onclick="form.modo='retirar';renderCart()">Retirar</button>
          <button class="opt ${form.modo==='entregar'?'on':''}" onclick="form.modo='entregar';renderCart()">Entrega</button>
        </div>
      </div>
      ${form.modo === 'local' ? `<div class="field"><input type="text" placeholder="Número da mesa" value="${esc(form.mesa)}" oninput="form.mesa=this.value"></div>` : ''}
      ${form.modo === 'entregar' ? `
        <div class="field"><input type="text" placeholder="Bairro" value="${esc(form.bairro)}" oninput="form.bairro=this.value"></div>
        <div class="field"><input type="text" placeholder="Rua e número" value="${esc(form.rua)}" oninput="form.rua=this.value"></div>
      ` : ''}
    `;

    foot.innerHTML = `
      <button class="btn btn--block" onclick="enviarWhatsApp()">Enviar pedido no WhatsApp</button>
      <button style="display:block;width:100%;text-align:center;margin-top:10px;color:var(--muted)" onclick="checkoutStep='list';renderCart()">Voltar</button>
    `;
  }
}

async function enviarWhatsApp() {
  if (!form.nome.trim()) return toast('Digite seu nome!');
  const total = CART.reduce((s, i) => s + (i.preco * i.qty), 0);

  let msg = `*RANCHARIA — PEDIDO*\n`;
  msg += `*Cliente:* ${form.nome.trim()}\n`;
  msg += `*Tipo:* ${form.modo.toUpperCase()}${form.modo === 'local' ? ` (Mesa ${form.mesa})` : ''}\n`;
  if (form.modo === 'entregar') msg += `*Endereço:* ${form.rua}, ${form.bairro}\n`;
  msg += `━━━━━━━━━━━━━━━━━━━━━\n\n`;

  CART.forEach(it => {
    msg += `${it.qty}x *${it.nome}* — ${brl(it.preco * it.qty)}\n`;
    if (it.proteinas.length) msg += `  • Proteína: ${it.proteinas.join(' + ')}\n`;
    it.subs.forEach(s => { msg += `  • ${s.nome}: ${s.itens.join(', ')}\n`; });
    if (it.obs) msg += `  • Obs: ${it.obs}\n`;
    msg += `\n`;
  });

  msg += `━━━━━━━━━━━━━━━━━━━━━\n`;
  msg += `*Total:* ${brl(total)}\n`;

  // Registra no banco
  fetch(`${SUPABASE_URL}/rest/v1/pedidos`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify({ cliente: form.nome, total, detalhes: msg })
  });

  window.open(`https://wa.me/${WHATSAPP_LOJA}?text=${encodeURIComponent(msg)}`, '_blank');
  CART = [];
  closeSheet('cart');
  toast('Pedido enviado com sucesso!');
}

$('#cartBar').onclick = openCart;
carregarCardapio();
</script>
</body>
</html>
